stages:
  - build-web
  - build-android

variables:
  COMPOSE_DOCKER_CLI_BUILD: "1"
  DOCKER_BUILDKIT: "1"

build-web:
  stage: build-web
  tags:
    - runner01
  only:
    - main
  script:
    - docker compose build expo-web
    - docker compose up -d --no-deps expo-web
    - echo "Deployment complete!"


build-android:
  stage: build-android
  tags:
    - runner01
  script:
    - mkdir -p artifacts
    - |
      docker build \
        --file Dockerfile.android \
        --target android-artifacts \
        --output type=local,dest=artifacts \
        --build-arg NPM_USER="$NPM_USER" \
        --build-arg NPM_PASS="$NPM_PASS" \
        --build-arg EXPO_PUBLIC_API_URL="$EXPO_PUBLIC_API_URL" \
        --build-arg EXPO_PUBLIC_KC_URL="$EXPO_PUBLIC_KC_URL" \
        --build-arg EXPO_PUBLIC_KC_SECRET="$EXPO_PUBLIC_KC_SECRET" \
        .

  artifacts:
    name: "apk-$CI_COMMIT_REF_SLUG-$CI_PIPELINE_ID"
    expire_in: 90 days
    paths:
      - artifacts/*.apk
