stages:
  - test
  - build
  - deploy

variables:
  COMPOSE_DOCKER_CLI_BUILD: "1"
  DOCKER_BUILDKIT: "1"
  BUILDKIT_PROGRESS: "plain"
  ANDROID_ARTIFACTS_DIR: "artifacts"
  ANDROID_UBUNTU_IMAGE: "ubuntu:24.04"
  ANDROID_REPOSITORY_URL: "https://dl.google.com/android/repository"
  ANDROID_NPM_REGISTRY: "https://registry.npmjs.org/"
  ANDROID_GRADLE_VARIANT: "Release"

test:
  stage: test
  tags:
    - runner01
  script:
    - docker build --file Dockerfile --target test --tag native-app-test .
  after_script:
    - docker image rm native-app-test:latest || true

build-web:
  stage: build
  resource_group: native-app-runner-build
  tags:
    - runner01
  only:
    - main
  script:
    - |
      set -eu
      rollback_image="native-app-expo-web:rollback-${CI_PIPELINE_ID}"
      rollback_available=false
      if docker image inspect native-app-expo-web >/dev/null 2>&1; then
        docker tag native-app-expo-web "$rollback_image"
        rollback_available=true
      fi
      rollback() {
        if [ "$rollback_available" = "true" ]; then
          docker tag "$rollback_image" native-app-expo-web
          docker compose up -d --no-build --no-deps expo-web
        fi
      }
      trap rollback ERR
      docker buildx build \
        --file Dockerfile \
        --target web-runtime \
        --tag native-app-expo-web \
        --load \
        --secret id=npm_user,env=NPM_USER \
        --secret id=npm_pass,env=NPM_PASS \
        --build-arg EXPO_PUBLIC_API_URL="$EXPO_PUBLIC_API_URL" \
        .
      docker compose up -d --no-build --no-deps expo-web
      for i in $(seq 1 30); do
        if [ "$(docker inspect -f '{{.State.Health.Status}}' mydream-app 2>/dev/null)" = "healthy" ]; then
          echo "Deployment complete!"
          trap - ERR
          exit 0
        fi
        sleep 2
      done
      docker logs --tail 100 mydream-app
      exit 1

build-android:
  stage: build
  interruptible: true
  resource_group: native-app-runner-build
  tags:
    - runner01
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - rm -rf "$ANDROID_ARTIFACTS_DIR"
    - mkdir -p "$ANDROID_ARTIFACTS_DIR"
    - |
      docker buildx build \
        --file Dockerfile.android \
        --target android-artifacts \
        --output "type=local,dest=$ANDROID_ARTIFACTS_DIR" \
        --build-arg UBUNTU_IMAGE="$ANDROID_UBUNTU_IMAGE" \
        --build-arg ANDROID_REPOSITORY_URL="$ANDROID_REPOSITORY_URL" \
        --build-arg NPM_REGISTRY="$ANDROID_NPM_REGISTRY" \
        --build-arg ANDROID_GRADLE_VARIANT="$ANDROID_GRADLE_VARIANT" \
        --build-arg ANDROID_ARCHITECTURES="arm64-v8a" \
        --build-arg EXPO_PUBLIC_API_URL="$EXPO_PUBLIC_API_URL" \
        .
    - ls -lah "$ANDROID_ARTIFACTS_DIR"
  artifacts:
    name: "release-apk-$CI_COMMIT_REF_SLUG-$CI_PIPELINE_ID"
    expose_as: "Android Release APK"
    expire_in: 90 days
    paths:
      - artifacts/

deploy-android-apk:
  stage: deploy
  tags:
    - runner01
  needs:
    - job: build-android
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  script:
    - test -f "$ANDROID_ARTIFACTS_DIR/app-release.apk"
    - mkdir -p /home/gitlab-runner/mydream/apk
    - cp "$ANDROID_ARTIFACTS_DIR/app-release.apk" /home/gitlab-runner/mydream/apk/my-dream-latest.apk.tmp
    - mv /home/gitlab-runner/mydream/apk/my-dream-latest.apk.tmp /home/gitlab-runner/mydream/apk/my-dream-latest.apk
    - ls -lah /home/gitlab-runner/mydream/apk/my-dream-latest.apk
