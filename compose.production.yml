name: md-app
x-runtime: &runtime
  restart: unless-stopped
  logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
services:
  app:
    <<: *runtime
    image: ${MD_APP_IMAGE:?required}
    env_file: .env
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m,uid=1000,gid=1000,mode=1770"]
    stop_grace_period: 30s
    mem_limit: 512m
    networks:
      edge: {aliases: [md-app]}
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode<400?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
networks:
  edge: {name: md-edge, external: true}
